version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelx-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-sentinelx_website_db}
      POSTGRES_USER: ${DB_USERNAME:-sentinelx_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sentinelx_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sentinelx_user} -d ${DB_NAME:-sentinelx_website_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: sentinelx_postgres_data
